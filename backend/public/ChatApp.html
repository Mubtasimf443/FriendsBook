<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chat App</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <style>
        body {
            font-family: "Inter", sans-serif;
            margin: 0;
            padding: 0;
            overflow: hidden; /* Prevent scrolling on main body */
        }

        /* Custom scrollbar for message list */
        .message-list::-webkit-scrollbar {
            width: 8px;
        }

        .message-list::-webkit-scrollbar-track {
            background: #f1f1f1;
            border-radius: 10px;
        }

        .message-list::-webkit-scrollbar-thumb {
            background: #888;
            border-radius: 10px;
        }

        .message-list::-webkit-scrollbar-thumb:hover {
            background: #555;
        }

        /* Loading spinner animation */
        .spinner {
            border: 4px solid rgba(0, 0, 0, 0.1);
            border-left-color: #3b82f6;
            border-radius: 50%;
            width: 40px;
            height: 40px;
            animation: spin 1s linear infinite;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        /* Message box for alerts */
        .message-box-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0, 0, 0, 0.5);
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 1000;
        }

        .message-box {
            background-color: white;
            padding: 2rem;
            border-radius: 0.75rem;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
            text-align: center;
        }
    </style>
    <script src="https://cdn.socket.io/4.8.1/socket.io.min.js" integrity="sha384-mkQ3/7FUtcGyoppY6bz/PORYoGqOl7/aSUMn2ymDOJcapfS6PHqxhRTMh1RR0Q6+" crossorigin="anonymous"></script>

</head>
<body class="bg-gray-100 min-h-screen flex flex-col">

    <div id="loading-screen" class="fixed inset-0 bg-white flex flex-col items-center justify-center z-50">
        <div class="spinner mb-4"></div>
        <p class="text-lg text-gray-700">Loading chat...</p>
    </div>

    <div id="message-box-overlay" class="message-box-overlay hidden">
        <div class="message-box">
            <p id="message-box-text" class="text-gray-800 mb-4"></p>
            <button id="message-box-close" class="bg-blue-500 hover:bg-blue-600 text-white font-bold py-2 px-4 rounded-md">OK</button>
        </div>
    </div>

    <div id="chat-container" class="hidden flex flex-1 overflow-hidden">
        <div class="w-1/4 bg-white border-r border-gray-200 flex flex-col shadow-md rounded-lg m-4">
            <div class="p-4 border-b border-gray-200 flex items-center justify-between">
                <h2 class="text-xl font-semibold text-gray-800">Chat Rooms</h2>
                <button id="create-room-btn" class="bg-blue-500 hover:bg-blue-600 text-white text-sm font-bold py-1 px-3 rounded-md transition duration-300 ease-in-out transform hover:scale-105">
                    <i class="fas fa-plus mr-1"></i> New Room
                </button>
            </div>
            <div class="p-4 border-b border-gray-200">
                <p class="text-sm text-gray-600">Your User ID: <span id="user-id" class="font-mono text-blue-700 break-all">Loading...</span></p>
            </div>
            <ul id="room-list" class="flex-1 overflow-y-auto message-list p-4">
                <li class="p-3 text-gray-500">No rooms available. Create one!</li>
            </ul>
        </div>

        <div class="flex-1 flex flex-col bg-white shadow-md rounded-lg m-4">
            <div class="p-4 border-b border-gray-200 flex items-center justify-between">
                <h2 id="current-room-name" class="text-xl font-semibold text-gray-800">Select a Room</h2>
                <button id="leave-room-btn" class="bg-red-500 hover:bg-red-600 text-white text-sm font-bold py-1 px-3 rounded-md transition duration-300 ease-in-out transform hover:scale-105 hidden">
                    <i class="fas fa-sign-out-alt mr-1"></i> Leave Room
                </button>
            </div>
            <div id="message-display" class="flex-1 overflow-y-auto message-list p-4 space-y-4">
                <div class="text-center text-gray-500 italic">No messages yet. Start chatting!</div>
            </div>
            <div id="message-input-area" class="p-4 border-t border-gray-200 flex items-center hidden">
                <input type="text" id="message-input" placeholder="Type your message..." class="flex-1 p-3 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-blue-500 mr-2">
                <button id="send-message-btn" class="bg-green-500 hover:bg-green-600 text-white font-bold py-3 px-6 rounded-md transition duration-300 ease-in-out transform hover:scale-105">
                    <i class="fas fa-paper-plane"></i> Send
                </button>
            </div>
        </div>
    </div>


    <script>
      
      const loadingScreen = document.getElementById('loading-screen');
      const chatContainer = document.getElementById('chat-container');
      let socket;


      window.addEventListener('load' , function (event) {
        socket = io('/socket/chat-messaging' , {
            auth : {
                token : '9e061bc7e0a22082c94fc63ff2bedef7f70aa9ca11d6f7d90b96ddd7d54a131b',
                profileType : 'video_calling_member'
            }
        });


        socket.on('connected' , function () {
            socket.emit('initialize-message' , null)
        });


        socket.on('message-initialization-completed' , function(activeRooms) {
            loadingScreen.style.display ='none';
            chatContainer.classList.remove('hidden')
            console.log(activeRooms);
        });

      })
    </script>
  
</body>
</html>
